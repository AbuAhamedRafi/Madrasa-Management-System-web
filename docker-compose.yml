services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mms_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://host.docker.internal:8000
    networks:
      - mms_frontend_network

networks:
  mms_frontend_network:
    driver: bridge

